# TeleHubX bundled Redis config (tporadowski/redis 5.0.14.1)
#
# Loaded by telehubx-supervisor on prod startup. CLI args (--bind, --port,
# --dir) override the corresponding settings here for safety.
#
# Usage surface in TeleHubX (audited Issue #12):
#   - AI chat context cache  (GET / SET EX / DEL)
#   - rate-limit counters    (GET / SET EX / INCR / EXPIRE)
#   - bot update dedup       (SET NX EX 7d / DEL)
# No queues, no pub/sub, no streams. Persistence is therefore disabled.

# ---- network ---------------------------------------------------------------
bind 127.0.0.1
protected-mode yes
port 6386
tcp-backlog 128
timeout 0
tcp-keepalive 300

# ---- general ---------------------------------------------------------------
daemonize no
loglevel notice
databases 16

# ---- persistence (DISABLED — KV is fully ephemeral by design) -------------
# All TeleHubX keys are TTL'd; losing them on restart is acceptable
# (cache will warm up; rate-limit counters reset; dedup briefly less effective).
save ""
appendonly no
stop-writes-on-bgsave-error no

# ---- memory ----------------------------------------------------------------
maxmemory 64mb
maxmemory-policy allkeys-lru

# ---- security --------------------------------------------------------------
# No requirepass: bound to loopback only and protected-mode is on.
# Customer can set REDIS_PASSWORD in .env + add `requirepass <pwd>` here
# if running on a multi-user machine.

# ---- slowlog (helpful for debugging if AI rate limit misbehaves) -----------
slowlog-log-slower-than 10000
slowlog-max-len 128
